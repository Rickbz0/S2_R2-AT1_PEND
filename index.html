<!DOCTYPE html>
<html lang="pt-br">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>digite o seu nome</title>
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    
    
     <header class="bg-white shadow-sm p-3 mb-5">
        <div class="container d-flex justify-content-center">
            <h1 class="h4 text-uppercase fw-bold ">
                <p> Digite o seu <span class="badge bg-primary">Nome</span></p>
            </h1>
        </div>
    </header>

    <main class="container d-flex align-items-center justify-content-center">
        <div class="card card-login w-100 p-4 bg-white"> 
            <div class="text-center mb-4">
                <h2 class="h5 text-muted">Aqui:</h2>
            </div>

            <form>
                <div class="mb-3">

                    <label for="name" class="form-label" id="name">Nome</label>
                    <input type="name" class="form-control" id="nomeAqui" placeholder="Seu nome aqui:" required>

                </div>
                

            </form>
            <div class="d-grid gap-2">

                <button type="submit" class="btn btn-logistica bg-dark text-white" id="btnEntrar" >Entrar</button>

            </div>
            <!-- Mensagem de feedback -->
            <p id="mensagem" class="fw-bold"></p>
        </div>
    </main>

      <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            
            <small>© 2026 Rápido & Seguro Logistica - Todos os direitos reservados.</small>
            <!-- simbolo Todos os direitos reservados (pesquisar isso quando o comando nao funcionar) -->
            
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
</body>

</html>
